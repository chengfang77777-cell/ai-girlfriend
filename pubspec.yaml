name: ai_girlfriend
description: AI女友应用 - 温柔可爱的虚拟伴侣
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.4.9
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  http: ^1.2.0
  audioplayers: ^5.2.1
  json_annotation: ^4.8.1
  cupertino_icons: ^1.0.6
  intl: ^0.19.0
  path_provider: ^2.1.2
  uuid: ^4.3.3
  webview_flutter: ^4.8.0
  webview_flutter_android: ^4.3.2
  webview_windows: ^0.4.0
  shelf: ^1.4.1
  logger: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.8
  json_serializable: ^6.7.1
  hive_generator: ^2.0.1
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/characters/
    - assets/models/
    - assets/web/
    - assets/web/js/
    - assets/animations/
